<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 760" width="1024" height="1024" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Ride flow diagram</title>
<desc>Flow of the taximeter CLI: waiting for start (s/q), the ride loop (m/p/f) with the already-in-that-state checks, and the option to start another ride</desc>

<style>
  text { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #2C2C2A; }
  .lbl { font-size: 12px; fill: #5F5E5A; }
  .box { fill: #F1EFE8; stroke: #888780; stroke-width: 1; }
  .end { fill: #FAECE7; stroke: #993C1D; stroke-width: 1; }
  .dec { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>

<rect x="0" y="0" width="740" height="760" fill="#ffffff"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- A: Start Program -->
<rect class="end" x="230" y="20" width="220" height="44" rx="22"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central">Start Program</text>

<!-- B: Show instructions -->
<rect class="box" x="230" y="100" width="220" height="44" rx="8"/>
<text x="340" y="122" text-anchor="middle" dominant-baseline="central">Show instructions (once)</text>

<!-- C: s or q? -->
<polygon class="dec" points="340,160 440,210 340,260 240,210"/>
<text x="340" y="210" text-anchor="middle" dominant-baseline="central">s or q?</text>

<!-- self-loop: other -->
<path class="arr" d="M255 190 C150 190 150 230 255 230" marker-end="url(#arrow)"/>
<text class="lbl" x="150" y="213" text-anchor="middle">other</text>

<!-- Z1: Program closed -->
<rect class="end" x="520" y="188" width="190" height="44" rx="22"/>
<text x="615" y="210" text-anchor="middle" dominant-baseline="central">Program closed</text>

<!-- D: Load rates + create Ride -->
<rect class="box" x="230" y="300" width="220" height="56" rx="8"/>
<text x="340" y="318" text-anchor="middle" dominant-baseline="central">Load rates from JSON</text>
<text x="340" y="336" text-anchor="middle" dominant-baseline="central" class="lbl">Create Ride (STOPPED)</text>

<!-- E: Command? -->
<polygon class="dec" points="340,385 450,440 340,495 230,440"/>
<text x="340" y="440" text-anchor="middle" dominant-baseline="central">Command?</text>

<!-- self-loop: m -->
<path class="arr" d="M280 398 C140 398 140 482 280 482" marker-end="url(#arrow)"/>
<text class="lbl" x="140" y="424" text-anchor="middle">m</text>
<text class="lbl" x="140" y="440" text-anchor="middle">if not moving:</text>
<text class="lbl" x="140" y="456" text-anchor="middle">state = MOVING</text>

<!-- self-loop: p -->
<path class="arr" d="M400 398 C540 398 540 482 400 482" marker-end="url(#arrow)"/>
<text class="lbl" x="540" y="424" text-anchor="middle">p</text>
<text class="lbl" x="540" y="440" text-anchor="middle">if not stopped:</text>
<text class="lbl" x="540" y="456" text-anchor="middle">state = STOPPED</text>

<!-- Z3: Program closed (from E, q) -->
<rect class="end" x="520" y="418" width="190" height="44" rx="22"/>
<text x="615" y="440" text-anchor="middle" dominant-baseline="central">Program closed</text>

<!-- J: Close segment / show total fare -->
<rect class="box" x="230" y="560" width="220" height="56" rx="8"/>
<text x="340" y="578" text-anchor="middle" dominant-baseline="central">Close segment</text>
<text x="340" y="596" text-anchor="middle" dominant-baseline="central" class="lbl">Show total fare</text>

<!-- K: Start another ride? -->
<polygon class="dec" points="340,640 450,690 340,740 230,690"/>
<text x="340" y="690" text-anchor="middle" dominant-baseline="central">Another ride?</text>

<!-- Z2: Program closed (from K, q) -->
<rect class="end" x="520" y="668" width="190" height="44" rx="22"/>
<text x="615" y="690" text-anchor="middle" dominant-baseline="central">Program closed</text>

<!-- Straight arrows -->
<line class="arr" x1="340" y1="64" x2="340" y2="100" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="144" x2="340" y2="160" marker-end="url(#arrow)"/>

<line class="arr" x1="440" y1="210" x2="520" y2="210" marker-end="url(#arrow)"/>
<text class="lbl" x="470" y="200">q</text>

<line class="arr" x1="340" y1="260" x2="340" y2="300" marker-end="url(#arrow)"/>
<text class="lbl" x="350" y="282">s</text>

<line class="arr" x1="340" y1="356" x2="340" y2="385" marker-end="url(#arrow)"/>

<line class="arr" x1="450" y1="440" x2="520" y2="440" marker-end="url(#arrow)"/>
<text class="lbl" x="470" y="430">q</text>

<line class="arr" x1="340" y1="495" x2="340" y2="560" marker-end="url(#arrow)"/>
<text class="lbl" x="350" y="530">f</text>

<line class="arr" x1="450" y1="690" x2="520" y2="690" marker-end="url(#arrow)"/>
<text class="lbl" x="470" y="680">q</text>

<!-- Long loop: Enter -> back to C -->
<path class="arr" d="M230 690 L100 690 L100 210 L240 210" marker-end="url(#arrow)"/>
<text class="lbl" x="80" y="450" text-anchor="middle" transform="rotate(-90 80 450)">Enter (start another ride)</text>

</svg>
